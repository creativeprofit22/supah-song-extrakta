[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "supah-song-extrakta"
version = "0.1.0"
description = "Local song extraction and guarded cleanup previews"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dynamic = ["dependencies"]

[tool.setuptools]
packages = ["songtool"]

[tool.setuptools.package-data]
songtool = ["blind_ab.html", "blind_ab.js"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
