name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Versions verified against official action READMEs/releases on 2026-09-07.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.28"
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Install CI audio tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Verify portable audio jobs (synthetic audio, no models)
        run: uv run --no-sync python -B scripts/verify_audio_jobs.py
      - name: Verify blind A/B preview (synthetic audio, no playback)
        run: uv run --no-sync python -B scripts/verify_blind_ab.py
      - name: Build source distribution and wheel
        run: uv build
